<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The browser chrome should match whichever scheme is rendering. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efece1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13120e" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="Football IQ — מבחן ידע כדורגל בעברית. בוחרים ליגות, קטגוריות ורמת קושי, עונים באמריקאי או בהקלדה חופשית, ומקבלים ציון אחד לשיתוף."
    />
    <title>Football IQ — עד כמה אתם באמת מבינים בכדורגל?</title>

    <!-- Fonts are the only third-party request the app makes; warm the
         connection so the display type does not arrive late. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- The brand mark, not an emoji: it renders identically on every platform
         and takes the same two inks as the rest of the design. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='21' fill='%23efece1' stroke='%2317160f' stroke-width='3'/%3E%3Cpath d='M24 11.5l8.6 6.3-3.3 10.2H18.7l-3.3-10.2z' fill='%23cf3b22' stroke='%2317160f' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M24 11.5V3.2M15.4 17.8L7.6 12.9M32.6 17.8l7.8-4.9M18.7 28l-5 8.2M29.3 28l5 8.2' stroke='%2317160f' stroke-width='2.6' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
